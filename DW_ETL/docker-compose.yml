services:
  postgres:
    image: postgres:16
    container_name: olist-dw-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-olist_dw}
      POSTGRES_USER: ${POSTGRES_USER:-dw_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - olist_dw_data:/var/lib/postgresql/data
      - ./sql/001_create_dw.sql:/docker-entrypoint-initdb.d/001_create_dw.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dw_user} -d ${POSTGRES_DB:-olist_dw}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  olist_dw_data:
